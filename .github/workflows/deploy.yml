name: Build and Deploy KinotiX Pages with Automated Share Generator

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sync CSS and Styles
        run: |
          mkdir -p docs/css
          cp -rf css/* docs/css/ || true
          mkdir -p docs/styles
          cp -rf styles/* docs/styles/ || true

      - name: Run Share Page Generator
        run: |
          node scripts/generate-share-pages.js

      - name: Commit and Push Generated Pages
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add i/ docs/i/ docs/css/
          if ! git diff-index --quiet HEAD; then
            git commit -m "Auto-generate static wallpaper share pages [skip ci]"
            git push
          else
            echo "No changes to commit."
          fi

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
