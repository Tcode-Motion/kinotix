name: Build and Deploy KinotiX Pages with Automated Share Generator

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sync Static Assets and Pages
        run: |
          mkdir -p docs/css docs/styles docs/assets
          cp -rf css/* docs/css/ || true
          cp -rf styles/* docs/styles/ || true
          cp -rf assets/* docs/assets/ || true
          cp -rf index.html download.html features.html 404.html manifest.webmanifest docs/ || true

      - name: Run Share Page Generator
        run: |
          node scripts/generate-share-pages.js

      - name: Run Category Hub & Guide Generator
        run: |
          node scripts/generate-category-pages.js

      - name: Run Multi-Tier Sitemap Generator
        run: |
          node scripts/generate-sitemaps.js

      - name: Run SEO Quality Validator
        run: |
          node scripts/seo-validator.js

      - name: Commit and Push Generated Pages
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A i/ docs/ sitemap* robots.txt || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-generate static wallpaper share pages and SEO sitemaps [skip ci]" || true
            git push || true
          fi

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
